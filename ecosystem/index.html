<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecosystem Simulation</title>
  <style>
    :root {
      --bg: #141a14;
      --panel: #1e261e;
      --text: #e8f0e8;
      --muted: #9fb09f;
      --grass: #3f8f3f;
      --rabbit: #e8e0c8;
      --fox: #e0742c;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    #layout { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 1fr 160px; height: 100vh; gap: 8px; padding: 8px; }
    #world { grid-row: 1; grid-column: 1; background: #000; width: 100%; height: 100%; image-rendering: pixelated; }
    #chart { grid-row: 2; grid-column: 1 / 3; background: var(--panel); width: 100%; height: 100%; border-radius: 6px; }
    #controls { grid-row: 1; grid-column: 2; background: var(--panel); border-radius: 6px; padding: 12px; overflow-y: auto; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
    .stats span:nth-child(odd) { color: var(--muted); }
    .buttons { display: flex; gap: 6px; margin-bottom: 12px; }
    button { flex: 1; background: #2c382c; color: var(--text); border: 1px solid #456; border-radius: 4px; padding: 6px; cursor: pointer; }
    button:hover { background: #3a493a; }
    label { display: block; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
    label output { float: right; color: var(--text); }
    input[type=range] { width: 100%; }
    input[type=number] { width: 100%; background: #0e140e; color: var(--text); border: 1px solid #456; border-radius: 4px; padding: 4px; }
    .legend { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    @media (max-width: 760px) {
      #layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto 140px; }
      #world { grid-column: 1; }
      #controls { grid-row: 2; grid-column: 1; }
      #chart { grid-row: 3; grid-column: 1; }
    }
  </style>
</head>
<body>
  <div id="layout">
    <canvas id="world"></canvas>
    <div id="controls">
      <h1>Ecosystem Simulation</h1>
      <div class="stats">
        <span>Tick</span><output id="tick">0</output>
        <span>Grass</span><output id="grassCount">0</output>
        <span>Rabbits</span><output id="rabbitCount">0</output>
        <span>Foxes</span><output id="foxCount">0</output>
      </div>
      <div class="buttons">
        <button id="playPause">Pause</button>
        <button id="step">Step</button>
        <button id="reset">Reset</button>
      </div>
      <label>Speed (ticks/frame) <output id="speedOut">1</output></label>
      <input id="speed" type="range" min="1" max="20" value="1" />
      <label>Grass regrowth chance <output id="grassRegrowOut"></output></label>
      <input id="grassRegrow" type="range" min="0" max="0.2" step="0.005" />
      <label>Rabbit energy from grass <output id="rabbitGainOut"></output></label>
      <input id="rabbitGain" type="range" min="1" max="20" step="1" />
      <label>Rabbit reproduce chance <output id="rabbitBreedOut"></output></label>
      <input id="rabbitBreed" type="range" min="0" max="0.3" step="0.01" />
      <label>Fox energy from rabbit <output id="foxGainOut"></output></label>
      <input id="foxGain" type="range" min="1" max="60" step="1" />
      <label>Fox reproduce chance <output id="foxBreedOut"></output></label>
      <input id="foxBreed" type="range" min="0" max="0.2" step="0.005" />
      <label>Seed (applies on reset)</label>
      <input id="seed" type="number" value="1" />
      <div class="legend">
        <span><i style="background: var(--grass)"></i>grass</span>
        <span><i style="background: var(--rabbit)"></i>rabbit</span>
        <span><i style="background: var(--fox)"></i>fox</span>
      </div>
    </div>
    <canvas id="chart"></canvas>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
