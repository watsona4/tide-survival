<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open World</title>
  <style>
    :root {
      --bg: #10130f;
      --panel: #1b2019;
      --panel2: #232a21;
      --text: #e9eee4;
      --muted: #9aa894;
      --accent: #d8b84a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #layout { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
    #view { position: relative; background: #000; }
    #world { display: block; width: 100%; height: 100%; cursor: grab; }
    #world.dragging { cursor: grabbing; }
    #hud { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; pointer-events: none; }
    #hud b { font-size: 18px; }
    #help { position: absolute; left: 10px; bottom: 10px; color: var(--muted); font-size: 12px; background: rgba(0,0,0,0.45); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
    #side { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
    section { padding: 10px 12px; border-bottom: 1px solid #2d352b; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    h2 { font-size: 12px; margin: 0 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    .row label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    button { background: var(--panel2); color: var(--text); border: 1px solid #44503f; border-radius: 4px; padding: 5px 9px; cursor: pointer; }
    button:hover { background: #2f3a2c; }
    button.active { border-color: var(--accent); color: var(--accent); }
    input[type=range] { flex: 1; min-width: 0; }
    input[type=number] { width: 80px; background: #0d100c; color: var(--text); border: 1px solid #44503f; border-radius: 4px; padding: 4px; }
    .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-variant-numeric: tabular-nums; }
    .stats span:nth-child(odd) { color: var(--muted); }
    #person { min-height: 150px; }
    #person .name { font-weight: 600; font-size: 15px; }
    #person .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .need { display: grid; grid-template-columns: 56px 1fr 30px; gap: 6px; align-items: center; font-size: 12px; margin: 2px 0; }
    .need .bar { height: 8px; background: #0d100c; border-radius: 4px; overflow: hidden; }
    .need .bar i { display: block; height: 100%; background: var(--accent); }
    .need .bar i.low { background: #d9534f; }
    .friends { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .friends b { color: var(--text); font-weight: 500; }
    #log { flex: 1; overflow-y: auto; font-size: 12px; min-height: 0; }
    #log div { padding: 2px 0; border-bottom: 1px solid #222a20; }
    #log .t { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
    #log .death { color: #e07a7a; }
    #log .warn { color: #e0b24a; }
    #log .day { color: #8fc0e8; }
    #log .social { color: #c9d9bf; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
    @media (max-width: 760px) {
      #layout { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
    }
  </style>
</head>
<body>
  <div id="layout">
    <div id="view">
      <canvas id="world"></canvas>
      <div id="hud"><b id="clock">Day 1 07:00</b><br /><span id="hudStats"></span></div>
      <div id="help">Drag to pan, wheel to zoom, click a person to inspect. WASD also pans.</div>
    </div>
    <div id="side">
      <section>
        <h1>Open World</h1>
        <div class="row">
          <button id="playPause">Pause</button>
          <button id="reset">Reset</button>
          <label>seed</label><input id="seed" type="number" value="1" />
        </div>
        <div class="row">
          <label>speed <output id="speedOut">1</output>x</label>
          <input id="speed" type="range" min="1" max="20" value="1" />
        </div>
        <div class="row">
          <button id="follow">Follow selected</button>
          <button id="center">Center village</button>
        </div>
      </section>
      <section>
        <div class="stats">
          <span>Population</span><span id="pop"></span>
          <span>Food</span><span id="food"></span>
          <span>Wood</span><span id="wood"></span>
          <span>Friendships</span><span id="friendships"></span>
        </div>
        <div class="legend" id="legend"></div>
      </section>
      <section id="person"><h2>Selected</h2><div class="sub">Click a person on the map.</div></section>
      <section id="logSection" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <h2>Events</h2>
        <div id="log"></div>
      </section>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
